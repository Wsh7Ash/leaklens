[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens"
version = "1.0.0"
description = "50 validated data-exposure hunting skills plus a leakplan CLI for authorized assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["secrets", "data-exposure", "agent-skills", "security", "classification"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leaklens = "leaklens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"